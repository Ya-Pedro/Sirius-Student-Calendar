version: '3.8'

services:
  schedule-sync:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  schedule-sync-k0409:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule-k0409
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env.k0409
    volumes:
      - ./data-k0409:/app/data
