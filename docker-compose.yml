version: '3.8'

services:
  schedule-sync:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  schedule-sync-k0409:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule-k0409
    restart: unless-stopped
    env_file:
      - .env.k0409
    volumes:
      - ./data-k0409:/app/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - schedule-sync
      - schedule-sync-k0409

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
