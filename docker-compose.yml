version: '3.8'

services:
  schedule-sync:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  schedule-sync-k0409:
    image: yapedro/sirius-schedule:latest
    container_name: sirius-schedule-k0409
    restart: unless-stopped
    env_file:
      - .env.k0409
    volumes:
      - ./data-k0409:/app/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
      - ./certbot/privkey.pem:/etc/ssl/private/privkey.pem:ro
    depends_on:
      - schedule-sync
      - schedule-sync-k0409
