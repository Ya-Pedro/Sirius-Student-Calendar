server {
    listen 80;
    server_name pedro.ittori.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:8080$request_uri;
    }
}

server {
    listen 8080 ssl;
    server_name pedro.ittori.ru;

    ssl_certificate /etc/letsencrypt/live/pedro.ittori.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedro.ittori.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://schedule-sync:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 8081 ssl;
    server_name pedro.ittori.ru;

    ssl_certificate /etc/letsencrypt/live/pedro.ittori.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedro.ittori.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://schedule-sync-k0409:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
